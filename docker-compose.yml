version: "3.9"

services:
  # ------------------------------------------------------------
  # Infra: Zookeeper, Kafka, Redis, Zipkin
  # ------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - customnetwork

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - customnetwork

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - customnetwork

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - customnetwork

  # ------------------------------------------------------------
  # USER-SERVICE + DB
  # ------------------------------------------------------------
  user-db:
    image: postgres:16
    container_name: user-db
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db-data/user:/var/lib/postgresql/data
    networks:
      - customnetwork

  user-service:
    container_name: user-service
    build: ./backend/user-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: user-db
      DB_PORT: 5432
      DB_NAME: userdb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SEC: ${JWT_SEC}
      JWT_REFRESH_SEC: ${JWT_REFRESH_SEC}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411
    depends_on:
      - user-db
      - kafka
      - redis
      - zipkin
    networks:
      - customnetwork

  # ------------------------------------------------------------
  # BOOKING-SERVICE + DB + Mailhog
  # ------------------------------------------------------------
  booking-db:
    image: postgres:16
    container_name: booking-db
    environment:
      POSTGRES_DB: bookingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db-data/booking:/var/lib/postgresql/data
    networks:
      - customnetwork

  booking-service:
    container_name: booking-service
    build: ./backend/booking-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: booking-db
      DB_PORT: 5432
      DB_NAME: bookingdb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SEC: ${JWT_SEC}
      JWT_REFRESH_SEC: ${JWT_REFRESH_SEC}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411
    depends_on:
      - booking-db
      - kafka
      - redis
      - zipkin
    networks:
      - customnetwork

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - customnetwork

  # ------------------------------------------------------------
  # ROOM-SERVICE + DB
  # ------------------------------------------------------------
  room-db:
    image: postgres:16
    container_name: room-db
    environment:
      POSTGRES_DB: roomdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db-data/room:/var/lib/postgresql/data
    networks:
      - customnetwork

  room-service:
    container_name: room-service
    build: ./backend/room-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: room-db
      DB_PORT: 5432
      DB_NAME: roomdb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SEC: ${JWT_SEC}
      JWT_REFRESH_SEC: ${JWT_REFRESH_SEC}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_SECRET_KEY: ${CLOUDINARY_SECRET_KEY}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411
    depends_on:
      - room-db
      - kafka
      - redis
      - zipkin
    networks:
      - customnetwork

  # ------------------------------------------------------------
  # PRICE-SERVICE + DB
  # ------------------------------------------------------------
  price-db:
    image: postgres:16
    container_name: price-db
    environment:
      POSTGRES_DB: pricedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db-data/price:/var/lib/postgresql/data
    networks:
      - customnetwork

  price-service:
    container_name: price-service
    build: ./backend/price-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: price-db
      DB_PORT: 5432
      DB_NAME: pricedb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SEC: ${JWT_SEC}
      JWT_REFRESH_SEC: ${JWT_REFRESH_SEC}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411
    depends_on:
      - price-db
      - kafka
      - redis
      - zipkin
    networks:
      - customnetwork

  # ------------------------------------------------------------
  # API-GATEWAY
  # ------------------------------------------------------------
  api-gateway:
    container_name: api-gateway
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411
    depends_on:
      - user-service
      - booking-service
      - room-service
      - price-service
    networks:
      - customnetwork

  # ------------------------------------------------------------
  # PGADMIN
  # ------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "15433:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: roman.rostock@gmail.com
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - user-db
      - booking-db
      - room-db
      - price-db
    networks:
      - customnetwork

  # ------------------------------------------------------------
  # FRONTEND
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend/booking_plattform
      dockerfile: Dockerfile
    networks:
      - public
    depends_on:
      - api-gateway
    volumes:
      - ./build:/app/build
    restart: always
    ports:
      - "4200:4200"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: '2G'

networks:
  customnetwork:
    driver: bridge
  public:
    driver: bridge

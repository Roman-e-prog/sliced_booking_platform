name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  # ============================================================
  # 1. BUILD ALL MICROSERVICES + FRONTEND
  # ============================================================
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
        - service: backend/user-service
          repo: sliced-backend-user-service
        - service: backend/booking-service
          repo: sliced-backend-booking-service
        - service: backend/room-service
          repo: sliced-backend-room-service
        - service: backend/price-service
          repo: sliced-backend-price-service
        - service: api-gateway
          repo: sliced-api-gateway
        - service: frontend
          repo: sliced-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Backend + API-Gateway Build (Java)
      # --------------------------------------------------------
      - name: Set up JDK 21
        if: startsWith(matrix.service, 'backend') || matrix.service == 'api-gateway'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        if: startsWith(matrix.service, 'backend') || matrix.service == 'api-gateway'
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build backend service
        if: startsWith(matrix.service, 'backend') || matrix.service == 'api-gateway'
        working-directory: ${{ matrix.service }}
        run: mvn -q -DskipTests package

      # --------------------------------------------------------
      # Frontend Build (Angular)
      # --------------------------------------------------------
      - name: Build frontend
        if: matrix.service == 'frontend'
        working-directory: frontend
        run: |
          npm install
          npm run build


  # ============================================================
  # 2. DOCKER BUILD & PUSH (ALL SERVICES + FRONTEND)
  # ============================================================
  docker:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: backend/user-service
            repo: sliced-backend-user-service
          - service: backend/booking-service
            repo: sliced-backend-booking-service
          - service: backend/room-service
            repo: sliced-backend-room-service
          - service: backend/price-service
            repo: sliced-backend-price-service
          - service: api-gateway
            repo: sliced-api-gateway
          - service: frontend
            repo: sliced-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.repo }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # 3. KUBERNETES DEPLOY (APPLY ALL MANIFESTS)
  # ============================================================
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Authenticate to Kubernetes
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=./kubeconfig

      - name: Apply Kubernetes manifests (recursive)
        run: kubectl apply -R -f kubernetes/

name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  # ============================================================
  # 1. BUILD & TEST ALL MICROSERVICES
  # ============================================================
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - backend/user-service
          - backend/booking-service
          - backend/room-service
          - backend/price-service
          - api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build service with Maven
        working-directory: ${{ matrix.service }}
        run: mvn -q -DskipTests package


  # ============================================================
  # 2. DOCKER BUILD & PUSH
  # ============================================================
  docker:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - backend/user-service
          - backend/booking-service
          - backend/room-service
          - backend/price-service
          - api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sliced-${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/sliced-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # 3. OPTIONAL: DEPLOYMENT JOB (z. B. Server, VM, Swarm, K8s)
  # ============================================================
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Deployment placeholder
        run: echo "Deployment step will be added later."

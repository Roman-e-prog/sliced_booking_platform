name: CI/CD Debug

on:
  push:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Workspace root
        run: |
          echo "=== WORKSPACE ROOT ==="
          pwd
          ls -R .

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build event-models
        working-directory: event-models
        run: |
          mvn -q -DskipTests install
          echo "=== event-models TARGET ==="
          ls -R target || echo "NO TARGET FOUND"

      - name: Build user-service
        working-directory: backend/user-service
        run: |
          mvn -q -DskipTests package
          echo "=== user-service TARGET ==="
          ls -R target || echo "NO TARGET FOUND"

      - name: Copy user-service JAR
        working-directory: backend/user-service
        run: |
          cp target/*.jar app.jar || echo "COPY FAILED"
          echo "=== user-service AFTER COPY ==="
          ls -la .

      - name: Workspace after build
        run: |
          echo "=== WORKSPACE AFTER BUILD ==="
          ls -R .


  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Workspace before Docker build
        run: |
          echo "=== WORKSPACE BEFORE DOCKER BUILD ==="
          ls -R .

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Enable Buildx
        run: |
          docker buildx create --use
          docker buildx inspect --bootstrap

      - name: Docker context (user-service)
        run: |
          echo "=== DOCKER CONTEXT (user-service) ==="
          ls -R backend/user-service

      - name: Build user-service image (debug)
        run: |
          echo "=== BUILDING user-service ==="
          docker buildx build \
            --progress=plain \
            -f backend/user-service/Dockerfile \
            backend/user-service \
            -t debug/user-service:latest \
            --load

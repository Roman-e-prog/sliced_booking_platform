name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  # ============================================================
  # 1. BUILD ALL MICROSERVICES + EVENT-MODELS + FRONTEND
  # ============================================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ------------------------------------------------------------
      # 1. Build & install EVENT-MODELS (Shared POJO Library)
      # ------------------------------------------------------------
      - name: Build event-models
        working-directory: event-models
        run: mvn -q -DskipTests install

      # ------------------------------------------------------------
      # 2. Build BACKEND MICROSERVICES
      # ------------------------------------------------------------
      - name: Build user-service
        working-directory: backend/user-service
        run: mvn -q -DskipTests package

      - name: Build booking-service
        working-directory: backend/booking-service
        run: mvn -q -DskipTests package

      - name: Build room-service
        working-directory: backend/room-service
        run: mvn -q -DskipTests package

      - name: Build price-service
        working-directory: backend/price-service
        run: mvn -q -DskipTests package

      - name: Build api-gateway
        working-directory: api-gateway
        run: mvn -q -DskipTests package

      # ------------------------------------------------------------
      # 3. Build FRONTEND
      # ------------------------------------------------------------
      - name: Build frontend
        working-directory: frontend/booking_platform
        run: |
          npm install
          npm run build


  # ============================================================
  # 2. DOCKER BUILD & PUSH (ALL SERVICES + FRONTEND)
  # ============================================================
  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Images
        run: |
          # BACKEND MICROSERVICES
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sliced-backend-user-service:latest backend/user-service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sliced-backend-booking-service:latest backend/booking-service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sliced-backend-room-service:latest backend/room-service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sliced-backend-price-service:latest backend/price-service

          # API-GATEWAY
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sliced-api-gateway:latest api-gateway

          # FRONTEND
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sliced-frontend:latest frontend/booking_platform

          # PUSH IMAGES
          docker push ${{ secrets.DOCKER_USERNAME }}/sliced-backend-user-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/sliced-backend-booking-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/sliced-backend-room-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/sliced-backend-price-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/sliced-api-gateway:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/sliced-frontend:latest


  # ============================================================
  # 3. DEPLOY TO SERVER (SSH)
  # ============================================================
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/roman/booking-platform
            git pull
            docker compose pull
            docker compose up -d

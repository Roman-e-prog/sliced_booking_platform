name: CI/CD Debug Pipeline

on:
  push:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show workspace root
        run: |
          echo "=== WORKSPACE ROOT ==="
          pwd
          ls -R .

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build event-models
        working-directory: event-models
        run: |
          mvn -q -DskipTests install
          echo "=== event-models TARGET ==="
          ls -R target || echo "NO TARGET FOUND"

      - name: Build user-service
        working-directory: backend/user-service
        run: |
          mvn -q -DskipTests package
          echo "=== user-service TARGET ==="
          ls -R target || echo "NO TARGET FOUND"

      - name: Copy user-service JAR to app.jar
        working-directory: backend/user-service
        run: |
          cp target/*.jar app.jar || echo "COPY FAILED"
          echo "=== user-service AFTER COPY ==="
          ls -la .

      - name: Build booking-service
        working-directory: backend/booking-service
        run: |
          mvn -q -DskipTests package
          echo "=== booking-service TARGET ==="
          ls -R target || echo "NO TARGET FOUND"

      - name: Copy booking-service JAR to app.jar
        working-directory: backend/booking-service
        run: |
          cp target/*.jar app.jar || echo "COPY FAILED"
          echo "=== booking-service AFTER COPY ==="
          ls -la .

      - name: Build room-service
        working-directory: backend/room-service
        run: |
          mvn -q -DskipTests package
          echo "=== room-service TARGET ==="
          ls -R target || echo "NO TARGET FOUND"

      - name: Copy room-service JAR to app.jar
        working-directory: backend/room-service
        run: |
          cp target/*.jar app.jar || echo "COPY FAILED"
          echo "=== room-service AFTER COPY ==="
          ls -la .

      - name: Build price-service
        working-directory: backend/price-service
        run: |
          mvn -q -DskipTests package
          echo "=== price-service TARGET ==="
          ls -R target || echo "NO TARGET FOUND"

      - name: Copy price-service JAR to app.jar
        working-directory: backend/price-service
        run: |
          cp target/*.jar app.jar || echo "COPY FAILED"
          echo "=== price-service AFTER COPY ==="
          ls -la .

      - name: Build api-gateway
        working-directory: api-gateway
        run: |
          mvn -q -DskipTests package
          echo "=== api-gateway TARGET ==="
          ls -R target || echo "NO TARGET FOUND"

      - name: Copy api-gateway JAR to app.jar
        working-directory: api-gateway
        run: |
          cp target/*.jar app.jar || echo "COPY FAILED"
          echo "=== api-gateway AFTER COPY ==="
          ls -la .

      - name: Build frontend
        working-directory: frontend/booking_platform
        run: |
          npm install
          npm run build
          echo "=== FRONTEND BUILD ==="
          ls -R dist || echo "NO DIST FOUND"

      - name: Show entire workspace after build
        run: |
          echo "=== WORKSPACE AFTER BUILD ==="
          ls -R .


  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show workspace before Docker build
        run: |
          echo "=== WORKSPACE BEFORE DOCKER BUILD ==="
          ls -R .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Enable Docker Buildx
        run: |
          docker buildx create --use
          docker buildx inspect --bootstrap

      - name: Show Docker version
        run: docker version

      - name: Show Docker build context for user-service
        run: |
          echo "=== DOCKER CONTEXT (user-service) ==="
          ls -R backend/user-service

      - name: Build & Push Docker Images
        run: |
          echo "=== BUILDING user-service ==="
          docker buildx build \
            -f backend/user-service/Dockerfile \
            backend/user-service \
            -t ${{ secrets.DOCKER_USERNAME }}/sliced-backend-user-service:latest \
            --progress=plain \
            --push

          echo "=== BUILDING booking-service ==="
          docker buildx build \
            -f backend/booking-service/Dockerfile \
            backend/booking-service \
            -t ${{ secrets.DOCKER_USERNAME }}/sliced-backend-booking-service:latest \
            --progress=plain \
            --push

          echo "=== BUILDING room-service ==="
          docker buildx build \
            -f backend/room-service/Dockerfile \
            backend/room-service \
            -t ${{ secrets.DOCKER_USERNAME }}/sliced-backend-room-service:latest \
            --progress=plain \
            --push

          echo "=== BUILDING price-service ==="
          docker buildx build \
            -f backend/price-service/Dockerfile \
            backend/price-service \
            -t ${{ secrets.DOCKER_USERNAME }}/sliced-backend-price-service:latest \
            --progress=plain \
            --push

          echo "=== BUILDING api-gateway ==="
          docker buildx build \
            -f api-gateway/Dockerfile \
            api-gateway \
            -t ${{ secrets.DOCKER_USERNAME }}/sliced-api-gateway:latest \
            --progress=plain \
            --push

          echo "=== BUILDING frontend ==="
          docker buildx build \
            -f frontend/booking_platform/Dockerfile \
            frontend/booking_platform \
            -t ${{ secrets.DOCKER_USERNAME }}/sliced-frontend:latest \
            --progress=plain \
            --push

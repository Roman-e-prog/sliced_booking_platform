name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build event-models
        working-directory: event-models
        run: mvn -q -DskipTests install

      - name: Build user-service
        working-directory: backend/user-service
        run: mvn -q -DskipTests package

      - name: Copy user-service JAR to app.jar
        working-directory: backend/user-service
        run: cp target/*.jar app.jar

      - name: Build booking-service
        working-directory: backend/booking-service
        run: mvn -q -DskipTests package

      - name: Copy booking-service JAR to app.jar
        working-directory: backend/booking-service
        run: cp target/*.jar app.jar

      - name: Build room-service
        working-directory: backend/room-service
        run: mvn -q -DskipTests package

      - name: Copy room-service JAR to app.jar
        working-directory: backend/room-service
        run: cp target/*.jar app.jar

      - name: Build price-service
        working-directory: backend/price-service
        run: mvn -q -DskipTests package

      - name: Copy price-service JAR to app.jar
        working-directory: backend/price-service
        run: cp target/*.jar app.jar

      - name: Build api-gateway
        working-directory: api-gateway
        run: mvn -q -DskipTests package

      - name: Copy api-gateway JAR to app.jar
        working-directory: api-gateway
        run: cp target/*.jar app.jar

      - name: Build frontend
        working-directory: frontend/booking_platform
        run: |
          npm install
          npm run build


  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Enable Docker Buildx
        run: |
          docker buildx create --use

      - name: Build & Push Docker Images
        run: |
          docker buildx build -f backend/user-service/Dockerfile backend/user-service -t ${{ secrets.DOCKER_USERNAME }}/sliced-backend-user-service:latest --push
          docker buildx build -f backend/booking-service/Dockerfile backend/booking-service -t ${{ secrets.DOCKER_USERNAME }}/sliced-backend-booking-service:latest --push
          docker buildx build -f backend/room-service/Dockerfile backend/room-service -t ${{ secrets.DOCKER_USERNAME }}/sliced-backend-room-service:latest --push
          docker buildx build -f backend/price-service/Dockerfile backend/price-service -t ${{ secrets.DOCKER_USERNAME }}/sliced-backend-price-service:latest --push
          docker buildx build -f api-gateway/Dockerfile api-gateway -t ${{ secrets.DOCKER_USERNAME }}/sliced-api-gateway:latest --push
          docker buildx build -f frontend/booking_platform/Dockerfile frontend/booking_platform -t ${{ secrets.DOCKER_USERNAME }}/sliced-frontend:latest --push

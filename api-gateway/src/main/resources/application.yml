server:
  port: 8080   # Gateway-Port bleibt IMMER hier

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "Content-Type"
              - "Authorization"
            allowCredentials: true

      # -----------------------------------------
      # 2. ROUTES
      # -----------------------------------------
      routes:

        # USER SERVICE
        - id: user-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/user/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
        # AUTH SERVICE (Teil des User-Service)
        - id: auth-service
          uri: http://localhost:8084
          predicates:
          - Path=/api/auth/**


        # BOOKING SERVICE (Load-Balanced)
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/booking/**
          filters:
            - StripPrefix=0
            - name: DedupeResponseHeader
              args:
               name: Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary
               strategy: RETAIN_FIRST
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200

            - name: CircuitBreaker
              args:
                name: bookingCB
                fallbackUri: forward:/fallback/booking

            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY
                methods: GET
                backoff.firstBackoff: 50ms
                backoff.maxBackoff: 500ms
                factor: 2
                basedOnPreviousValue: true

            # Bulkhead NICHT möglich → GlobalFilter übernimmt das

        # ROOM SERVICE
        - id: room-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/rooms/**
          filters:
            - StripPrefix=0

        # PRICE SERVICE
        - id: price-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/priceSetting/**
          filters:
            - StripPrefix=0

    # -----------------------------------------
    # 3. LOAD BALANCER CONFIG (Pflicht für lb://)
    # -----------------------------------------
    loadbalancer:
      instances:
        booking-service:
          - uri: http://localhost:8081   # MUSS existieren, sonst Fehler

# -----------------------------------------
# 4. LOGGING
# -----------------------------------------
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
  pattern:
    level: "%5p [requestId=%X{requestId}, traceId=%X{traceId}, spanId=%X{spanId}]"

# -----------------------------------------
# 5. RESILIENCE4J
# -----------------------------------------
resilience4j:
  circuitbreaker:
    instances:
      bookingCB:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3


# -----------------------------------------
# 6. TRACING / ZIPKIN
# -----------------------------------------
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

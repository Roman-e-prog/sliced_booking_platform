server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      # -----------------------------------------
      # 1. GLOBAL FILTERS (Request-ID, Logging)
      # -----------------------------------------
      default-filters:
        - AddRequestHeader=X-Request-ID, #{uuid}   # Request-ID Tracking
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      # -----------------------------------------
      # 2. ROUTES
      # -----------------------------------------
      routes:

        # USER SERVICE
        - id: user-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/user/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50     # 50 req/min
                redis-rate-limiter.burstCapacity: 100

        # BOOKING SERVICE (Load-Balanced)
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/booking/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
            - name: CircuitBreaker
              args:
                 name: bookingCB
                 fallbackUri: forward:/fallback/booking
            - name: Retry
              args:
                  retries: 3                # 3 Wiederholungen
                  statuses: BAD_GATEWAY     # bei 502 erneut versuchen
                  methods: GET              # nur GET wiederholen
                  backoff:
                    firstBackoff: 50ms      # Wartezeit vor erstem Retry
                    maxBackoff: 500ms       # maximale Wartezeit
                    factor: 2               # exponentielles Backoff
                    basedOnPreviousValue: true
            - name: Bulkhead
              args:
                  name: bookingBH
                  type: SEMAPHORE
                  maxConcurrentCalls: 20      # maximal 20 gleichzeitige Requests
                  maxWaitDuration: 0

        # ROOM SERVICE
        - id: room-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/room/**

        # PRICE SERVICE
        - id: price-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/price/**

    # -----------------------------------------
    # 3. LOAD BALANCER CONFIG
    # -----------------------------------------
    loadbalancer:
      ribbon:
        enabled: false

# -----------------------------------------
# 4. LOGGING
# -----------------------------------------
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
  pattern:
    level: "%5p [requestId=%X{requestId}, traceId=%X{traceId}, spanId=%X{spanId}]"

resilience4j:
  circuitbreaker:
    instances:
      bookingCB:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  threadpoolbulkhead:
    instances:
      userClientBH:
        maxThreadPoolSize: 10
        coreThreadPoolSize: 5
        queueCapacity: 20
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0   # 100% aller Requests tracen

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

